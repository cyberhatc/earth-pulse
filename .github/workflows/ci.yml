name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Sample → engine → pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install numpy scipy fastapi uvicorn httpx pydantic pytest
      - name: Build sample store
        run: python pipeline/run_pipeline.py --sample
      - name: Precompute engine artifacts
        run: python engine/run_engine.py
      - name: Run tests
        run: python -m pytest tests/ api/tests/ -q

  web:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
