name: Bug report
description: Report a reproducible problem in Earth Pulse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide evidence-based, reproducible details. Do not include secrets, credentials, tokens, or private data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands, inputs, coordinates, or clicks where relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, browser, deployment mode (local/Docker/Vercel/Render), commit SHA if known.
      placeholder: |
        - OS:
        - Python:
        - Node/npm:
        - Browser:
        - Mode:
        - Commit:
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Paste relevant error messages or command output (redact secrets).
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates (if applicable).
          required: false
        - label: I have not included secrets or credentials in this report.
          required: true
