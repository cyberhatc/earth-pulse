name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose changes that align with Earth Pulse's evidence-first and scientific-integrity goals.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Note any impacts on data provenance, uncertainty/limitations, API/UI behavior, or deployment.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity
      options:
        - label: This proposal does not rely on fabricated data, metrics, or unsupported claims.
          required: true
