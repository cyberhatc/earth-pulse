# Local: `api` = single-service image (backend + built frontend on :8000).
# `web`  = hot-reload frontend dev server on :3000, proxies /api -> api:8000.
# Production-like local (everything on :8000): `docker compose up --build api`
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile      # single-service image: FastAPI + web/dist
    ports:
      - "8000:8000"
    environment:
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - EP_RAG_BACKEND=${EP_RAG_BACKEND:-ollama}
      - HF_ROUTER_MODEL=${HF_ROUTER_MODEL:-}
      - HF_RAG_SPACE_URL=${HF_RAG_SPACE_URL:-}
      - EP_RAG_TIMEOUT=${EP_RAG_TIMEOUT:-90}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      # NOTE: do NOT bind-mount ./models/artifacts here — it would shadow the
      # forecaster artifact baked into the image (a fresh clone has only .gitkeep).
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY=http://api:8000
    volumes:
      - ./web:/app
    depends_on:
      - api
